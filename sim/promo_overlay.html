<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SledPack concept film — text layer</title>
<link rel="stylesheet" href="css/promo_overlay.css">
</head>
<body>
<div id="stage">
  <div id="tag"></div>
  <div id="mark">SLEDPACK <span>· CONCEPT</span></div>
  <div id="hero"><h1></h1><p></p></div>
  <div id="lower"><h2></h2><p></p></div>
  <svg id="callouts" width="1920" height="1080"></svg>
  <div id="labels"></div>
  <div id="hud">
    <div class="modes"></div>
    <div class="row"><div class="k" data-k="speed"></div><div class="v"><b id="vSpeed"></b><i>m/s</i></div></div>
    <div class="row"><div class="k" data-k="wind"></div><div class="v"><b id="vWind"></b><i>m/s</i></div><div class="bar"><span id="bWind"></span><em></em></div></div>
    <div class="row"><div class="k" data-k="line"></div><div class="v"><b id="vLine"></b><i>m</i></div></div>
    <div class="note"></div>
  </div>
  <div id="onboard"><span class="rec"></span><span class="lab"></span><div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div></div>
  <div id="facts"><h3></h3><div class="grid"></div><p class="foot"></p><div class="dev"><h4></h4><ul></ul></div></div>
  <div id="end"><h1></h1><p class="sub"></p><p class="disc"></p></div>
</div>
<script type="module" src="js/promo/overlay.js"></script>
</body>
</html>
